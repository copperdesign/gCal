# Reusable calendar sync — called from a consuming site's own workflow.
#
#   jobs:
#     sync:
#       uses: copperdesign/gCal/.github/workflows/sync.yml@v0.5.1
#       permissions:
#         contents: write        # see PERMISSIONS below — not optional
#       with:
#         config: gcal.config.json
#       secrets:
#         api-key: ${{ secrets.GCAL_API_KEY }}
#
# Pin to a TAG, not to @master: this file changes with the CLI it runs.
#
# Requires, in the calling repo: @copperdesign/gcal as a dependency, a
# package-lock.json (both `npm ci` and setup-node's cache need one), and
# the config file named by `config`.
#
# WHAT THIS DOES, AND WHAT IT POINTEDLY DOES NOT
# It fetches the calendar, writes one deterministic JSON file, and
# commits it when it changed. It does not build and it does not deploy.
# Coupling a deploy in here would tie the workflow to one host and make
# it useless to everyone else — the consumer's existing pipeline picks
# the committed file up on its own terms.
#
# WHO OWNS THE COMMIT (`commit: false`)
# By default this job commits and pushes, which forces one ordering on
# the caller: the artifact lands in git first, and a deploy gated on
# `changed` runs after it. For a consumer that deploys from Actions that
# ordering is not cosmetic, because the two failure modes are not
# symmetric.
#
#   · Commit first, deploy second — push succeeds, deploy fails. Git now
#     records the new calendar, so tomorrow's run finds no diff, reports
#     changed=false, and never retries the deploy. The live site stays
#     stale until a human notices. One red run is the only signal ever
#     given, and every run after it is green.
#
#   · Deploy first, commit second — deploy succeeds, commit fails. The
#     site is current and git is briefly behind, so tomorrow's run sees
#     the same diff, redeploys, and pushes. It self-heals.
#
# `commit: false` buys the second ordering. The job fetches, writes and
# reports `changed` as usual, then stops: the file is left uncommitted
# and uploaded as a run artifact, because the caller's next job gets a
# fresh runner and an empty workspace, so the file has to travel somehow.
# The caller downloads it, deploys, and makes the commit itself. That
# keeps the deploy out of here (see above) while letting the consumer
# pick which failure it would rather have.
#
# PERMISSIONS ARE THE CALLER'S TO GRANT (this one bites before step 1)
# This workflow declares no `permissions:` of its own, deliberately. A
# called workflow inherits the token of the job that called it and cannot
# ask for more than that job holds, so a `permissions: contents: write`
# in here is not a request — it is a ceiling check, and it fails the
# entire run as a `startup_failure`, before a single step executes, for
# any caller whose repository defaults the workflow token to read. That
# has been the default for every repository created since February 2023,
# so "it never even started" was the out-of-the-box experience until
# 0.5.1. The grant belongs on the calling job:
#
#     sync:
#       uses: copperdesign/gCal/.github/workflows/sync.yml@v0.5.1
#       permissions:
#         contents: write
#
# Under `commit: false` nothing here pushes, so grant nothing at all — a
# job that fetches from the open internet has no business holding a write
# token. That asymmetry is the second reason this isn't declared here:
# `permissions` takes no expressions, so any fixed block would force half
# the callers to over-grant.
#
# THE ONE NON-OBVIOUS THING (read this before scheduling it)
# A push made with GITHUB_TOKEN does NOT trigger other GitHub Actions
# workflows. That is deliberate on GitHub's part — it is what stops a
# workflow that commits from re-triggering itself forever — but it means
# the commit this job makes will NOT start your deploy workflow.
#
#   · Deploying from GitHub Actions (Firebase, rsync, most setups):
#     schedule this job AHEAD of your deploy job's own cron and let the
#     deploy pick the committed file up. A ~15 minute gap is plenty.
#     Expecting the commit to chain will leave the calendar never
#     deploying, silently.
#
#   · Deploying from a host that watches the repo (Cloudflare Pages,
#     Netlify, Vercel): those build from a webhook rather than from an
#     Actions workflow, so this restriction does not apply to them and
#     the commit should trigger a build directly. Verify it does on your
#     setup; if it doesn't, add a deploy-hook call as a final step.
#
# CONCURRENCY
# Two runs racing (a manual dispatch during the cron, say) would both
# checkout, both commit, and one would lose its push. The concurrency
# group serialises them instead. If a push still fails because something
# else landed on the branch mid-run, this fails loudly on purpose — a
# silently lost update is the worse outcome.

name: Sync calendar

on:
  workflow_call:
    inputs:
      config:
        description: 'Path to the gcal-sync config file'
        type: string
        default: 'gcal.config.json'
      node-version:
        description: 'Node version to run the sync on'
        type: string
        default: '20'
      commit-message:
        description: 'Commit message used when the calendar changed'
        type: string
        default: 'chore: sync calendar'
      strict:
        description: 'Fail the job when the fetch fails, instead of keeping the existing artifact'
        type: boolean
        default: false
      commit:
        description: 'Commit and push the artifact when it changed. false leaves it uncommitted and uploads it for the caller instead — see the header'
        type: boolean
        default: true
    secrets:
      api-key:
        description: 'Server-side Google API key, restricted to the Calendar API'
        required: true
    # A reusable workflow needs outputs declared at BOTH levels: here, on
    # `workflow_call`, and again on the job below. Job outputs alone are
    # invisible to the caller — `needs.sync.outputs.changed` reads the
    # value mapped here, not the one on the job.
    outputs:
      changed:
        description: "'true' when the artifact changed — and was committed, unless commit is false. 'false' otherwise. Gate a deploy job on this."
        value: ${{ jobs.sync.outputs.changed }}
      events:
        description: 'Number of events in the artifact, or empty when no artifact exists.'
        value: ${{ jobs.sync.outputs.events }}
      out:
        description: 'Path the artifact was written to, read from the config. The caller needs it to stage its own commit.'
        value: ${{ jobs.sync.outputs.out }}
      artifact:
        description: "Name of the uploaded run artifact — set only when commit is false and something changed, empty otherwise. Feed it to download-artifact."
        value: ${{ jobs.sync.outputs.artifact }}

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed:  ${{ steps.commit.outputs.changed }}
      events:   ${{ steps.commit.outputs.events }}
      out:      ${{ steps.commit.outputs.out }}
      artifact: ${{ steps.commit.outputs.artifact }}
    # No `permissions:` here on purpose — the calling job grants the write
    # this needs to push. Declaring it here fails the run at startup for
    # any caller whose default token is read. See PERMISSIONS in the header.
    concurrency:
      group: gcal-sync-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      # --ignore-scripts: this job only needs the CLI, and a consumer's
      # postinstall is usually build tooling (image encoders, fetchers)
      # that has no business running in a data-sync job.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Sync
        env:
          GCAL_API_KEY: ${{ secrets.api-key }}
        run: npx gcal-sync --config "${{ inputs.config }}" ${{ inputs.strict && '--strict' || '' }}

      # Read the output path from the config rather than adding
      # everything: `git add -A` in a job with write permission would
      # happily sweep up anything else the runner touched.
      - name: Detect the change, and commit it unless the caller said not to
        id: commit
        env:
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          out=$(node -p "JSON.parse(require('fs').readFileSync('${{ inputs.config }}','utf8')).out")
          # Published unconditionally, including on the paths that write
          # nothing: a caller making its own commit needs the path to
          # stage, and asking it to re-read the config would be a second
          # copy of this line in someone else's repo.
          echo "out=$out" >> "$GITHUB_OUTPUT"

          if [ ! -f "$out" ]; then
            # The sync exited 0 without writing — a failed fetch with no
            # artifact to fall back on. It already said so on stderr.
            echo "No artifact at $out — nothing to commit."
            # Every exit path sets `changed`. Leaving it unset on one branch
            # would hand the caller an empty string, and `if: … == 'true'`
            # would still skip the deploy — right answer, wrong reason, and
            # it breaks the moment someone writes `!= 'false'`.
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "events=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Counted from the artifact rather than scraped from the CLI's
          # stdout: the log line is for humans and may be reworded, but the
          # file shape is the versioned contract.
          echo "events=$(node -p "JSON.parse(require('fs').readFileSync('$out','utf8')).events.length")" >> "$GITHUB_OUTPUT"

          # Stage FIRST, then ask whether anything is staged.
          #
          # `git diff --quiet -- "$out"` is the obvious way to write this and is
          # WRONG: git diff compares the working tree against the index and does
          # not see untracked files at all. On a consumer's very first sync the
          # artifact is brand new, so that check reports "unchanged", the job
          # exits 0, and the file is never committed — every run writes it, every
          # run discards it, and the calendar never appears. It looks like a
          # green job doing nothing, forever. `git diff --cached` after `git add`
          # sees a new file and an edited one alike.
          #
          # This runs under commit: false too — staging is how the change is
          # DETECTED, not merely how it is committed, and an index nobody
          # commits dies with the runner.
          git add -- "$out"
          if git diff --cached --quiet -- "$out"; then
            echo "Calendar unchanged — nothing to commit, no build triggered."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$COMMIT" = 'true' ]; then
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "$COMMIT_MESSAGE"
            # `changed` is written AFTER the push, not before: a caller
            # gating a deploy on it must not be told the artifact is on the
            # branch while the push is still in doubt.
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Committed $out."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # The name is decided here rather than in the upload step so
            # there is one source of truth: that step uploads exactly when
            # this is non-empty, so the two cannot drift into publishing
            # under a name the caller was never handed.
            echo "artifact=gcal-$(basename "$out")" >> "$GITHUB_OUTPUT"
            echo "Calendar changed — left uncommitted (commit: false); handing it to the caller."
          fi

      # A caller's next job gets a fresh runner and an empty workspace, so
      # under commit: false the file has to travel through the run's
      # artifact store or not at all. Only when it actually changed: on a
      # quiet night the caller's deploy is skipped anyway, and an upload
      # nobody downloads is pure storage.
      #
      # NOTE for the caller: upload-artifact roots a single-file artifact at
      # that file's own directory, so the archive holds `kalender.json`, not
      # `src/content/kalender.json`. download-artifact therefore needs
      # `path:` set to the artifact's directory, or the file lands at the
      # repo root and the build quietly uses the older committed copy.
      - name: Hand the artifact to the caller
        if: steps.commit.outputs.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.commit.outputs.artifact }}
          path: ${{ steps.commit.outputs.out }}
          if-no-files-found: error
          # A handoff inside one run. The default 90 days would keep a
          # year's worth of nightly calendars nobody will ever open.
          retention-days: 1
