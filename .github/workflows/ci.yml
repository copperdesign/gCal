# Test and smoke-check the package on every push / PR.
#
# Two halves, because the package has two halves.
#
# The BROWSER half (index.js, template.js, consent.js) touches DOM APIs
# and can't be imported in plain Node, so all CI can do for it is confirm
# every file still parses and that the package metadata is internally
# consistent — stray syntax error, unbalanced template literal, broken
# `exports` subpath. Its real smoke test is test/index.html, opened by
# hand in a browser.
#
# The NODE half (src/node.js, bin/gcal-sync.mjs) is importable and
# executable by design, so it gets a real test suite. The determinism
# tests there are the ones that matter most: consumers commit the sync
# artifact and gate their deploy on whether it changed, so a regression
# doesn't look like a bug — it looks like a site that quietly redeploys
# every night forever.
#
# Still no `npm install` — the package declares no runtime or dev
# dependencies, and `node --test` is built in. The matrix runs the LTS
# line, both for parser coverage and because `node --test` itself and
# Intl's ICU data have moved between releases.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke:
    name: smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: parse check (src/*.js + bin/*.mjs)
        run: |
          # node --check on every shipped source file. A single broken
          # file should fail the job loudly, not silently skip.
          # bin/ is included because it ships too — a syntax error there
          # wouldn't surface until a consumer's nightly job ran.
          set -e
          for f in src/*.js bin/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: test suite
        run: |
          # Covers the /node entry point and the gcal-sync CLI: import
          # graph, determinism, DST handling, fail-soft behaviour, and
          # what actually lands in the published tarball. No network —
          # the CLI takes an injected fetcher precisely so this stays
          # hermetic.
          node --test test/*.test.mjs

      - name: banner versions match package.json
        run: |
          # The /*! …vX.Y.Z … */ header on line 1 of each src file is
          # the license notice that survives minification. Easy to
          # forget to bump alongside package.json — check every src/*.js
          # against package.json.version so the drift fails the build.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const pkg = require('./package.json').version;
            const files = fs.readdirSync('src').filter(f => f.endsWith('.js')).map(f => path.join('src', f));
            let bad = false;
            for (const file of files) {
              const first = fs.readFileSync(file, 'utf8').split('\n', 1)[0];
              const m = first.match(/^\/\*!\s*gCal\s+—\s+v(\d+\.\d+\.\d+)/);
              if (!m) {
                console.error(file + ': banner not found or malformed (expected /*! gCal — vX.Y.Z …)');
                bad = true;
                continue;
              }
              if (m[1] !== pkg) {
                console.error(file + ': banner (' + m[1] + ') does not match package.json (' + pkg + ')');
                bad = true;
              }
            }
            if (bad) process.exit(1);
          "

      - name: package.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: exports map subpaths resolve
        run: |
          # Every entry in pkg.exports must point at a file that exists.
          # This catches a deleted/renamed primitive that the exports map
          # still advertises — a silent dist-time break for consumers.
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            const entries = Object.values(pkg.exports).map(v =>
              typeof v === 'string' ? v : v.import || v.default
            );
            let bad = false;
            for (const entry of entries) {
              const path = entry.replace(/^\.\//, '');
              if (!fs.existsSync(path)) {
                console.error('exports entry missing on disk:', entry);
                bad = true;
              }
            }
            if (bad) process.exit(1);
          "

      - name: files allowlist points at real paths
        run: |
          # pkg.files is the npm publish allowlist. If an entry doesn't
          # exist on disk we'd publish a tarball missing whatever the
          # README promised — catch it now.
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            let bad = false;
            for (const entry of pkg.files || []) {
              if (!fs.existsSync(entry)) {
                console.error('files entry missing on disk:', entry);
                bad = true;
              }
            }
            if (bad) process.exit(1);
          "
